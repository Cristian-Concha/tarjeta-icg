<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101b45">
    <meta name="description" content="Digital business card for Cristian Concha Prieto, ICG Managing Director.">
    <title>Cristian Concha Prieto | ICG</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page-shell">
      <section class="card" aria-label="ICG digital business card">
        <header class="card-header">
          <div class="logo-window" aria-label="ICG, Concha y Gana">
            <svg viewBox="0 0 600 402" aria-hidden="true" focusable="false">
              <image href="assets/icg-company-card.png" width="1336" height="402"></image>
            </svg>
          </div>
          <button class="language-toggle" type="button" aria-label="Switch language" aria-pressed="false">
            <span lang="en">中文</span><span class="toggle-divider" aria-hidden="true">/</span><span lang="zh-Hans">EN</span>
          </button>
        </header>

        <div class="gold-rule"></div>

        <section class="identity">
          <p class="eyebrow" data-en="DIGITAL BUSINESS CARD" data-zh="电子商务名片">DIGITAL BUSINESS CARD</p>
          <h1>Cristian<br>Concha Prieto</h1>
          <p class="role" data-en="Managing Director" data-zh="总经理">Managing Director</p>
          <p class="company" data-en="ICG · Engineering &amp; Electrical Installations" data-zh="ICG · 工程与电气安装">ICG · Engineering &amp; Electrical Installations</p>
        </section>

        <nav class="actions" aria-label="Contact actions">
          <a class="action primary" href="cristian-concha-prieto.vcf" download>
            <span class="icon" aria-hidden="true">↓</span>
            <span data-en="Save contact" data-zh="保存联系人">Save contact</span>
          </a>
          <a class="action" href="tel:+56990862014">
            <span class="icon" aria-hidden="true">⌕</span>
            <span data-en="Call" data-zh="拨打电话">Call</span>
          </a>
          <a class="action" href="mailto:cristian@icgsa.cl">
            <span class="icon" aria-hidden="true">✉</span>
            <span data-en="Email" data-zh="发送邮件">Email</span>
          </a>
          <a class="action" href="https://www.icgsa.cl" target="_blank" rel="noopener noreferrer">
            <span class="icon" aria-hidden="true">↗</span>
            <span data-en="Website" data-zh="网站">Website</span>
          </a>
        </nav>

        <section class="wechat" aria-labelledby="wechat-title">
          <div class="section-heading">
            <span class="heading-line" aria-hidden="true"></span>
            <h2 id="wechat-title" data-en="Connect on WeChat" data-zh="微信联系我">Connect on WeChat</h2>
            <span class="heading-line" aria-hidden="true"></span>
          </div>
          <figure>
            <img src="assets/wechat-qr.png" alt="Cristian Concha's WeChat QR code">
            <figcaption data-en="Scan with WeChat to add me as a contact." data-zh="请使用微信扫一扫，添加我为联系人。">Scan with WeChat to add me as a contact.</figcaption>
          </figure>
        </section>

        <footer>
          <span>Chile</span><span aria-hidden="true">•</span><span data-en="Available for business" data-zh="商务合作洽谈">Available for business</span>
        </footer>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
